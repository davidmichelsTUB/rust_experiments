[package]
name = "rust_experiments"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_logistic"
crate-type = ["cdylib", "rlib"]


[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.12.0"
ndarray = {version = "0.16.1", features = ["rayon"]}
numpy = "0.22"
argmin = "0.11.0"
argmin-math = { version = "0.5.1", features = ["ndarray_latest"] }

